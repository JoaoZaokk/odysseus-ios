name: Odysseus
options:
  bundleIdPrefix: com.zao
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  WhisperCPP:
    # Official whisper.cpp xcframework (whisper + parakeet + ggml/Metal), see Vendor/WhisperCPP/Package.swift.
    path: Vendor/WhisperCPP
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.12.4"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    # DEVELOPMENT_TEAM comes from Signing.xcconfig → Local.xcconfig (gitignored), so the
    # real team id is never committed. See Local.xcconfig.example.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # NO: the "Check SF Symbol floor" phase greps every Swift file under SRCROOT, and the
    # script sandbox denies all reads under SRCROOT except declared inputs (an archive
    # failed with "scripts/check-symbols.sh: Operation not permitted"). No other script phase exists.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Odysseus:
    build:
      targets:
        Odysseus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OdysseusTests
    archive:
      config: Release

targets:
  OdysseusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OdysseusTests
    dependencies:
      - target: Odysseus
    settings:
      base:
        # xcodegen writes no Info.plist for the test bundle, and codesign refuses
        # to sign it without one.
        GENERATE_INFOPLIST_FILE: YES

  Odysseus:
    type: application
    platform: iOS
    postCompileScripts:
      - name: Check SF Symbol floor
        script: sh "$SRCROOT/scripts/check-symbols.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: Odysseus
        excludes:
          - "Resources/Info-macOS.plist"
          - "Resources/Odysseus-macOS.entitlements"
    dependencies:
      - package: MarkdownUI
      - package: WhisperCPP
      - package: ZIPFoundation
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zao.odysseus
        PRODUCT_NAME: Odysseus
        # 1.10 (iOS build 26, macOS build 20): the live-server contract sync
        # (docs/AUDIT-1.10.md). 1.9 — iOS build 25, macOS build 19 — is the
        # version in App Review; this bump is deliberate and must survive merges.
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "27"
        # 1.11: increased-memory-limit, so a 1-2 GB on-device model is not a silent jetsam.
        CODE_SIGN_ENTITLEMENTS: Odysseus/Resources/Odysseus.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Odysseus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Odysseus
        # Drive version from the build settings (xcodegen hardcodes CFBundleVersion=1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # So App Store Connect can pull the marketing icon.
        CFBundleIconName: AppIcon
        # Orientations must live in the Info.plist (INFOPLIST_KEY_* are ignored
        # with a custom plist) — iPad needs all four (fixes upload error 90474).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        ITSAppUsesNonExemptEncryption: false
        # Background refresh for the opt-in task notifications (Conta): the
        # system wakes the app now and then to read the reminder queue
        # (TaskNotificationPoller.refreshTaskID). No push — the server has none.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.zao.odysseus.tasks.refresh
        # These raw values are only the LAST-RESORT fallback: CFBundleDevelopmentRegion
        # resolves to `en`, so they must be ENGLISH. Every language (incl. pt-BR) is
        # translated in Resources/<lang>.lproj/InfoPlist.strings — without those the
        # system consent dialog shows this text verbatim regardless of the app's
        # language, which is what got 1.6 rejected under guideline 4.0 (Design).
        NSLocalNetworkUsageDescription: "Odysseus needs local network access to reach your AI server on your network."
        NSMicrophoneUsageDescription: "Odysseus uses the microphone so you can dictate your messages by voice."
        NSSpeechRecognitionUsageDescription: "Odysseus transcribes your speech into text on your device."
        NSFaceIDUsageDescription: "Odysseus uses Face ID to lock the app and sign you in automatically (optional)."
        NSAppTransportSecurity:
          # Scoped to the LAN: plain HTTP is allowed only to local/private hosts
          # (the self-hosted server / ComfyUI). Public hosts must use HTTPS — and
          # ServerConfig.normalize already forces https for any non-local host, so
          # the blanket NSAllowsArbitraryLoads is intentionally NOT set (S6).
          NSAllowsLocalNetworking: true

  # Native macOS app — same SwiftUI source as iOS, with platform shims in
  # Config/PlatformCompat.swift. Builds for Apple Silicon Macs (macOS 14+).
  Odysseus-macOS:
    type: application
    platform: macOS
    postCompileScripts:
      - name: Check SF Symbol floor
        script: sh "$SRCROOT/scripts/check-symbols.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: Odysseus
        excludes:
          - "Resources/Info.plist"
          - "Resources/Odysseus-macOS.entitlements"
    dependencies:
      - package: MarkdownUI
      - package: WhisperCPP
      - package: ZIPFoundation
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zao.odysseus
        PRODUCT_NAME: Odysseus
        # 1.10 (iOS build 26, macOS build 20): the live-server contract sync
        # (docs/AUDIT-1.10.md). 1.9 — iOS build 25, macOS build 19 — is the
        # version in App Review; this bump is deliberate and must survive merges.
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "21"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Odysseus/Resources/Odysseus-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Odysseus/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Odysseus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 JoaoZaokk — PolyForm Noncommercial License 1.0.0"
        # English fallback only — see the iOS target above. The per-language text
        # lives in Resources/<lang>.lproj/InfoPlist.strings.
        NSMicrophoneUsageDescription: "Odysseus uses the microphone so you can dictate your messages by voice."
        NSSpeechRecognitionUsageDescription: "Odysseus transcribes your speech into text on your device."
        NSLocalNetworkUsageDescription: "Odysseus needs local network access to reach your AI server on your network."
        NSAppTransportSecurity:
          # Same as iOS: LAN-scoped only — plain HTTP to local/private hosts; public
          # hosts use HTTPS (enforced by ServerConfig.normalize). No arbitrary loads (S6).
          NSAllowsLocalNetworking: true
